    <style>
      html.is-booting, html.is-booting body { overflow: hidden; }
      html, body { background: #000; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 28px;
        background: #000;
        color: #fff;
        transition: opacity .45s ease, visibility .45s ease;
      }
      #boot.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      #boot .bootlogo { display: grid; justify-items: center; gap: 14px; }
      #boot svg { width: min(156px, 42vw); height: auto; overflow: visible; }
      #boot .dot {
        opacity: 0;
        transform: scale(.15);
        transform-box: fill-box;
        transform-origin: center;
        animation: bootdot .7s cubic-bezier(.16, 1, .3, 1) forwards;
        animation-delay: calc(var(--i) * 64ms);
      }
      #boot .bootname, #boot .boottag {
        margin: 0;
        font-family: Sora, Inter, "Segoe UI", system-ui, sans-serif;
        opacity: 0;
        transform: translateY(8px);
      }
      #boot .bootname {
        width: min(176px, 48vw);
        aspect-ratio: 522 / 208;
        overflow: hidden;
        clip-path: inset(0 100% 0 0);
        animation: bootwrite .75s cubic-bezier(.16, 1, .3, 1) 2.25s forwards;
      }
      #boot .bootname img {
        display: block;
        width: 100%;
        height: auto;
        margin-top: calc(100% * -565 / 522);
      }
      #boot .boottag {
        font-size: clamp(22px, 3vw, 32px);
        font-weight: 600;
        letter-spacing: -.03em;
        animation: bootname .55s cubic-bezier(.16, 1, .3, 1) 2.8s forwards;
      }
      #boot .boottag span { color: #ee2c82; }
      #boot .bootbar {
        width: min(180px, 46vw);
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(255, 255, 255, .16);
      }
      #boot .bootbar span {
        display: block;
        height: 100%;
        background: #ee2c82;
        transform: scaleX(0);
        transform-origin: left;
        animation: bootbar 2.85s cubic-bezier(.45, 0, .2, 1) forwards;
      }
      @keyframes bootdot {
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes bootname {
        to { opacity: 1; transform: none; }
      }
      @keyframes bootwrite {
        to { opacity: 1; transform: none; clip-path: inset(0 0 0 0); }
      }
      @keyframes bootbar {
        to { transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot { transition: none; }
        #boot .dot, #boot .bootname, #boot .boottag, #boot .bootbar span {
          animation: none;
          opacity: 1;
          transform: none;
        }
        #boot .bootname { clip-path: none; }
        #boot .bootbar span { transform: scaleX(1); }
      }
    </style>
